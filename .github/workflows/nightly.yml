name: nightly

# 每天北京时间 00:00（UTC 16:00）自动 rebase tzfix 到上游最新并构建 nightly 镜像。
# 也可手动触发；冲突会失败并通知，需人工解决后重跑。
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: '即使上游无新提交也强制重新构建'
        required: false
        type: boolean
        default: false

env:
  IMAGE_NAME: ghcr.io/chjuan/beecount-cloud
  UPSTREAM: TNT-Likely/BeeCount-Cloud

jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 推 rebase 后的 tzfix 分支
      packages: write     # 推 GHCR
    steps:
      - name: Checkout fork (tzfix 分支, 全量历史)
        uses: actions/checkout@v4
        with:
          ref: tzfix
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM }}.git
          git fetch upstream main --tags
          echo "upstream_tip=$(git rev-parse upstream/main)" >> $GITHUB_ENV

      - name: Check if rebase needed
        id: need
        run: |
          set -euo pipefail
          DEV_TIP=$(git rev-parse HEAD)
          UP_TIP=$(git rev-parse upstream/main)
          # merge-base：tzfix 和 upstream/main 的共同祖先
          BASE=$(git merge-base HEAD upstream/main || echo "")
          if [ -z "$BASE" ]; then
            # 没有共同祖先（不应该发生），按需要 rebase 处理
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif [ "$BASE" = "$UP_TIP" ]; then
            # upstream/main 是 tzfix 的祖先 → 上游无新提交
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tzfix_tip=$DEV_TIP" >> "$GITHUB_OUTPUT"
          echo "up_tip=$UP_TIP" >> "$GITHUB_OUTPUT"

      - name: Rebase tzfix onto upstream/main
        id: rebase
        if: steps.need.outputs.needed == 'true'
        run: |
          set -e
          git rebase upstream/main
          echo "new_tip=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push rebased tzfix
        if: steps.need.outputs.needed == 'true'
        run: |
          git push --force-with-lease origin HEAD:tzfix

      - name: Decide whether to build
        id: build
        run: |
          FORCE="${{ inputs.force_build }}"
          NEEDED="${{ steps.need.outputs.needed }}"
          if [ "$NEEDED" = "true" ]; then
            echo "do=true" >> "$GITHUB_OUTPUT"
          elif [ "$FORCE" = "true" ]; then
            echo "do=true" >> "$GITHUB_OUTPUT"
          else
            echo "do=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve nightly version
        if: steps.build.outputs.do == 'true'
        id: v
        run: |
          DATE=$(date -u +%Y%m%d)
          SHA=$(git rev-parse --short HEAD)
          echo "version=nightly-${DATE}-${SHA}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.build.outputs.do == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.build.outputs.do == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.build.outputs.do == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.build.outputs.do == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=nightly
          labels: |
            org.opencontainers.image.title=BeeCount-Cloud-nightly
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}

      - name: Build and push
        if: steps.build.outputs.do == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Feishu
        if: always()
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_URL }}
          VERSION: ${{ steps.v.outputs.version }}
          STATUS: ${{ job.status }}
          NEEDED: ${{ steps.need.outputs.needed }}
          BUILD_DO: ${{ steps.build.outputs.do }}
          UP_TIP: ${{ steps.need.outputs.up_tip }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "FEISHU_WEBHOOK_URL not configured, skipping notification"
            exit 0
          fi
          if [ "$STATUS" != "success" ]; then
            title="❌ BeeCount-Cloud nightly 失败"
            color="red"
            text="**状态**: \`$STATUS\`
**上游 tip**: \`${UP_TIP:0:10}\`
**仓库**: [$REPO](https://github.com/$REPO)
若是 rebase 冲突，请到 tzfix 分支手动解决后重跑
[查看失败日志]($RUN_URL)"
          elif [ "$BUILD_DO" = "false" ]; then
            title="🌙 BeeCount-Cloud nightly（无变化）"
            color="blue"
            text="上游无新提交，跳过构建
**上游 tip**: \`${UP_TIP:0:10}\`
**仓库**: [$REPO](https://github.com/$REPO)"
          else
            title="🌙 BeeCount-Cloud nightly 构建成功"
            color="green"
            if [ "$NEEDED" = "true" ]; then
              text="**版本**: \`$VERSION\`
已 rebase 到上游最新并发布
**镜像**: \`$IMAGE_NAME:$VERSION\` / \`$IMAGE_NAME:nightly\`
**上游 tip**: \`${UP_TIP:0:10}\`
**仓库**: [$REPO](https://github.com/$REPO)
[查看构建详情]($RUN_URL)"
            else
              text="**版本**: \`$VERSION\`
强制重建（无上游变化）
**镜像**: \`$IMAGE_NAME:$VERSION\` / \`$IMAGE_NAME:nightly\`
**仓库**: [$REPO](https://github.com/$REPO)
[查看构建详情]($RUN_URL)"
            fi
          fi
          payload=$(jq -n \
            --arg title "$title" \
            --arg text "$text" \
            --arg color "$color" \
            '{
              msg_type: "interactive",
              card: {
                schema: "2.0",
                header: {
                  title: { tag: "plain_text", content: $title },
                  template: $color
                },
                body: {
                  direction: "vertical",
                  elements: [
                    { tag: "markdown", content: $text }
                  ]
                }
              }
            }')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' -d "$payload")
          echo "feishu response: $code"
